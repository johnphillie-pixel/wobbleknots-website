<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Wobbleknots</title>
<meta name="description" content="The Wobbleknots — a puppet rock band turning nursery rhymes into rock anthems for kids. Watch, follow, and sing along.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ziggy: #AC0D10;
    --boom: #1F3B73;
    --pluck: #B8860B;
    --sparkle: #6B3FA0;
    --tango: #4C7A2F;
    --sky: #4FA8E0;
    --cream: #FFF8EC;
    --ink: #2B2118;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Fredoka', sans-serif;
    background: linear-gradient(180deg, var(--sky) 0%, #79C3EE 45%, var(--cream) 45%, var(--cream) 100%);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
  }
  .page {
    width: 100%;
    max-width: 480px;
    padding: 32px 20px 40px;
    text-align: center;
  }
  .logo {
    width: 140px;
    height: 140px;
    border-radius: 50%;
    object-fit: cover;
    border: 5px solid var(--cream);
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    margin-top: 8px;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin: 16px 0 4px;
    letter-spacing: 0.5px;
  }
  .tagline {
    font-weight: 500;
    color: var(--ink);
    opacity: 0.85;
    margin: 0 0 20px;
    font-size: 1rem;
  }
  .hero {
    width: 100%;
    border-radius: 18px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    margin-bottom: 24px;
    display: block;
  }
  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  .link-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    justify-content: center;
    padding: 16px 20px;
    border-radius: 999px;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    text-decoration: none;
    color: #fff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.18);
    transition: transform 0.12s ease;
    border: 3px solid rgba(255,255,255,0.5);
  }
  .link-btn:active { transform: scale(0.97); }
  .link-btn svg { width: 22px; height: 22px; flex-shrink: 0; }
  .youtube    { background: #FF0033; }
  .tiktok     { background: #111111; }
  .instagram  { background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af, #515bd4); }
  .facebook   { background: #1877F2; }
  .merch {
    background: var(--cream);
    color: var(--ink);
    border: 3px dashed #C9B79C;
    cursor: default;
  }
  .merch .badge {
    font-size: 0.7rem;
    font-weight: 600;
    background: var(--tango);
    color: #fff;
    padding: 2px 8px;
    border-radius: 999px;
    margin-left: 6px;
  }
  .members {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin: 28px 0 8px;
  }
  .members span {
    width: 14px;
    height: 14px;
    border-radius: 50%;
    display: inline-block;
  }
  footer {
    margin-top: 24px;
    font-size: 0.75rem;
    line-height: 1.5;
    opacity: 0.7;
  }
</style>
</head>
<body>
<div class="page">
  <img class="logo" src="assets/logo.jpg" alt="The Wobbleknots logo">
  <h1>THE WOBBLEKNOTS</h1>
  <p class="tagline">Nursery rhymes, rocked out. 🎸</p>

  <img class="hero" src="assets/hero.jpg" alt="Ziggy, Boom, Pluck, Sparkle, and Tango performing on the Wobble Treehouse stage">

  <nav class="links">
    <a class="link-btn youtube" href="https://www.youtube.com/@wobbleknotsband" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8ZM9.6 15.5V8.5L15.8 12Z"/></svg>
      YouTube
    </a>
    <a class="link-btn tiktok" href="https://www.tiktok.com/@wobbleknotsband" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.6 2h-3.2v13.4a2.9 2.9 0 1 1-2.1-2.8V9.3a6.1 6.1 0 1 0 5.3 6V8.8a8.2 8.2 0 0 0 4.8 1.5V7.1a4.9 4.9 0 0 1-4.8-5.1Z"/></svg>
      TikTok
    </a>
    <a class="link-btn instagram" href="https://www.instagram.com/wobbleknotsband" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c2.7 0 3.1 0 4.1.1 1.1 0 1.8.2 2.5.5.7.3 1.2.6 1.8 1.2.6.6.9 1.1 1.2 1.8.3.7.5 1.4.5 2.5.1 1 .1 1.4.1 4.1s0 3.1-.1 4.1c0 1.1-.2 1.8-.5 2.5-.3.7-.6 1.2-1.2 1.8-.6.6-1.1.9-1.8 1.2-.7.3-1.4.5-2.5.5-1 .1-1.4.1-4.1.1s-3.1 0-4.1-.1c-1.1 0-1.8-.2-2.5-.5-.7-.3-1.2-.6-1.8-1.2-.6-.6-.9-1.1-1.2-1.8-.3-.7-.5-1.4-.5-2.5C2 15.1 2 14.7 2 12s0-3.1.1-4.1c0-1.1.2-1.8.5-2.5.3-.7.6-1.2 1.2-1.8.6-.6 1.1-.9 1.8-1.2.7-.3 1.4-.5 2.5-.5C8.9 2 9.3 2 12 2Zm0 5a5 5 0 1 1 0 10 5 5 0 0 1 0-10Zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6Zm5.2-3.5a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4Z"/></svg>
      Instagram
    </a>
    <a class="link-btn facebook" href="https://www.facebook.com/wobbleknotsband" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.6 9.9v-7H7.9V12h2.5V9.8c0-2.5 1.5-3.9 3.8-3.9 1.1 0 2.2.2 2.2.2v2.4h-1.3c-1.2 0-1.6.8-1.6 1.6V12h2.8l-.4 2.9h-2.4v7A10 10 0 0 0 22 12Z"/></svg>
      Facebook
    </a>
    <a class="link-btn merch" aria-disabled="true">
      🛒 Merch <span class="badge">Coming Soon</span>
    </a>
  </nav>

  <div class="members" aria-hidden="true">
    <span style="background:var(--ziggy)"></span>
    <span style="background:var(--boom)"></span>
    <span style="background:var(--pluck)"></span>
    <span style="background:var(--sparkle)"></span>
    <span style="background:var(--tango)"></span>
  </div>

  <footer>
    The Wobbleknots are brought to life with AI-assisted animation, voices, and music — written, directed, and produced by a real, independent creator.<br>
    &copy; 2026 Jage Co., LLC
  </footer>
</div>
</body>
</html>
